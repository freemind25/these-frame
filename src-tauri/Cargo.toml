[package]
name = "thesisframe"
version = "0.2.0"
description = "ThesisFrame — Rédaction académique"
authors = ["ThesisFrame"]
edition = "2021"

[lib]
name = "thesisframe_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
