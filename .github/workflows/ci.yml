name: CI (lint + build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint
        continue-on-error: true # 5 erreurs préexistantes (react-hooks/set-state-in-effect) à traiter séparément

      - name: Prisma generate
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:./db/custom.db"

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./db/custom.db"
          NODE_ENV: production
