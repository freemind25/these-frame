# ─── ThesisFrame ─ Tauri Windows Build ───────────────────────
# Builds a Windows NSIS installer on push to a v* tag.
# The .exe is automatically attached to the GitHub Release.

name: Tauri Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        shell: bash
        run: npm install -g bun

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build Next.js frontend
        shell: bash
        run: bun run build

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        shell: bash
        run: cargo tauri build

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE=$(find src-tauri/target/release/bundle/nsis -name '*.exe' -maxdepth 1 | head -1)
          if [ -z "$EXE" ]; then
            echo "No .exe found in bundle output"
            exit 1
          fi
          echo "Found: $EXE"
          TAG=${GITHUB_REF_NAME}
          gh release upload "$TAG" "$EXE"
