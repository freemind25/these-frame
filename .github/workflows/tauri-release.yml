# ─── ThesisFrame ─ Tauri Windows Build (Split Jobs) ─────────────
# Job 1 (ubuntu): Build Next.js standalone → upload artifact
# Job 2 (windows): Download artifact, bundle resources, build with tauri-action
# Triggers on v* tag push.

name: Tauri Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '22.17.0'

jobs:
  # ── Job 1: Build Next.js standalone on Linux ─────────────────
  build-next:
    name: Build Next.js (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        run: npm install -g bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile 2>/dev/null || bun install

      - name: Prisma generate
        run: bunx prisma generate

      - name: Build Next.js (standalone)
        run: npx next build

      - name: Verify standalone output
        run: |
          echo "Contents of .next/:"
          ls -la .next/
          if [ ! -d ".next/standalone" ]; then
            echo "ERROR: .next/standalone not found!" >&2
            exit 1
          fi
          echo "Standalone OK: $(du -sh .next/standalone | cut -f1)"

      - name: Pack standalone + static + public
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          cp scripts/embed-start.js .next/standalone/start.js
          tar -czf next-standalone.tar.gz -C .next/standalone .
          echo "Artifact size: $(du -sh next-standalone.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: next-standalone.tar.gz
          retention-days: 1

  # ── Job 2: Build Tauri NSIS on Windows ───────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: build-next
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Next artifact
        uses: actions/download-artifact@v4
        with:
          name: next-standalone

      - name: Extract & prepare resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/app src-tauri/resources/node
          tar -xzf next-standalone.tar.gz -C src-tauri/resources/app/
          echo "=== App resources ==="
          ls src-tauri/resources/app/ | head -20
          echo "server.js: $(wc -c < src-tauri/resources/app/server.js 2>/dev/null || echo MISSING)"
          echo "start.js:  $(wc -c < src-tauri/resources/app/start.js 2>/dev/null || echo MISSING)"

      - name: Download Node.exe
        shell: bash
        run: |
          curl -sL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip" -o /tmp/node.zip
          unzip -jo /tmp/node.zip "node-v${NODE_VERSION}-win-x64/node.exe" -d src-tauri/resources/node/
          rm -f /tmp/node.zip
          echo "node.exe: $(wc -c < src-tauri/resources/node/node.exe)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ThesisFrame ${{ github.ref_name }}'
          releaseBody: 'Windows installer for ThesisFrame.'
          releaseDraft: false
          prerelease: false
