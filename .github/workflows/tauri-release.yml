# ─── ThesisFrame ─ Tauri Windows Build ───────────────────────
# Builds a Windows NSIS installer on push to a v* tag.
# The .exe is automatically attached to the GitHub Release.

name: Tauri Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri app (NSIS)
        shell: bash
        run: |
          cd src-tauri
          cargo build --release

      - name: Create NSIS installer
        shell: bash
        run: |
          cd src-tauri
          cargo tauri build --bundles nsis

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE=$(find src-tauri/target/release/bundle/nsis -name '*.exe' -maxdepth 1 | head -1)
          if [ -z "$EXE" ]; then
            echo "No .exe found"
            find src-tauri/target -name '*.exe' 2>/dev/null || true
            exit 1
          fi
          echo "Found: $EXE"
          gh release upload "${GITHUB_REF_NAME}" "$EXE"
