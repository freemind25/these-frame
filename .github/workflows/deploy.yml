# ─── ThesisFrame — GitHub Actions CI/CD vers Infomaniak VPS ──────
# Activez ce workflow après avoir configuré les secrets GitHub :
#   VPS_HOST      = adresse IP du serveur Infomaniak
#   VPS_USER      = root (ou utilisateur SSH)
#   VPS_SSH_KEY   = clé privée SSH (clé ED25519 recommandée)
#
# Le déploiement se fait via SSH + docker compose.
# Caddy gère automatiquement le renouvellement TLS.

name: Deploy to Infomaniak VPS

on:
  workflow_dispatch:  # Déclenchement manuel uniquement — activez après avoir configuré les secrets

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ─── Checkout ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Build Docker images localement ─────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        run: docker build -t thesisframe-app .

      - name: Build search-service image
        run: docker build -t thesisframe-search ./mini-services/search-service

      # ─── Transférer les images vers le VPS ────────────────
      - name: Save Docker images
        run: |
          docker save thesisframe-app thesisframe-search | gzip > images.tar.gz

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "images.tar.gz,docker-compose.yml,docker/Caddyfile"
          target: "/opt/thesisframe"
          strip_components: 0

      - name: Load images on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/thesisframe
            docker load < images.tar.gz
            rm images.tar.gz
            docker compose up -d --no-build
            docker image prune -f

      # ─── Vérification ──────────────────────────────────
      - name: Health check
        run: |
          sleep 15
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" "https://${{ secrets.VPS_DOMAIN || 'localhost' }}/api/ai-status" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "✅ Application en ligne (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Réponse inattendue : HTTP $HTTP_CODE"
          fi
