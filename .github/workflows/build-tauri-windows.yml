name: Build Windows .exe (Tauri v2)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release (ex: v0.2.1). Laisser vide pour un build simple.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Switch Prisma to SQLite + Windows binary
        shell: pwsh
        run: |
          $schema = Get-Content 'prisma/schema.prisma' -Raw
          $schema = $schema -replace 'provider = "postgresql"', 'provider = "sqlite"'
          $schema = $schema -replace '(?m)^\s*directUrl\s*=\s*env\("DIRECT_URL"\)\s*\r?\n', ''
          if ($schema -notmatch 'binaryTargets') {
            $schema = $schema -replace '(generator client \{)', "`$1`n  binaryTargets = [`"windows`"]"
          }
          Set-Content 'prisma/schema.prisma' $schema

      - name: Set DATABASE_URL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'db' | Out-Null
          Set-Content -Path '.env' -Value 'DATABASE_URL=file:./db/custom.db'

      - name: Build Next.js standalone + Prisma
        id: build-frontend
        run: |
          $env:DATABASE_URL = 'file:./db/custom.db'
          $env:NODE_ENV = 'production'
          bunx prisma generate
          bun run build 2>&1 | Tee-Object -FilePath build-frontend.log
        continue-on-error: true

      - name: Download portable Node.js
        if: steps.build-frontend.outcome == 'success'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v22.16.0/node-v22.16.0-win-x64.zip' -OutFile 'node.zip'
          Expand-Archive -Path 'node.zip' -DestinationPath 'node-tmp'
          Move-Item 'node-tmp/node-v22.16.0-win-x64' 'node-portable'
          Remove-Item 'node.zip', 'node-tmp' -Recurse -Force

      - name: Assemble embedded server resources
        if: steps.build-frontend.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/server' | Out-Null

          # Standalone Next.js server (server.js + minimal node_modules)
          Copy-Item '.next/standalone/*' 'src-tauri/resources/server/' -Recurse -Force
          if (Test-Path '.next/static') {
            Copy-Item '.next/static' 'src-tauri/resources/server/.next/static' -Recurse -Force
          }
          Copy-Item 'public' 'src-tauri/resources/server/public' -Recurse -Force
          Remove-Item 'src-tauri/resources/server/.env' -Force -ErrorAction SilentlyContinue

          # Portable Node.js runtime (binary only, ~110MB saved vs full dist)
          Copy-Item 'node-portable/node.exe' 'src-tauri/resources/server/node.exe'

          Write-Host 'Embedded server resources assembled.'
          Get-ChildItem 'src-tauri/resources/server' | Select-Object Name, Length

      - name: Build Tauri
        id: build-tauri
        if: steps.build-frontend.outcome == 'success'
        run: |
          $env:DATABASE_URL = 'file:./db/custom.db'
          $env:NODE_ENV = 'production'
          bunx tauri build 2>&1 | Tee-Object -FilePath build-tauri.log
        continue-on-error: true

      - name: Upload NSIS installer as artifact
        if: steps.build-tauri.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ThesisFrame-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/') && steps.build-tauri.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

      # ═══════════════════════════════════════════
      # CI: Capture build log and publish as issue on failure
      # ═══════════════════════════════════════════
      - name: Determine failure step
        if: failure() || steps.build-frontend.outcome == 'failure' || steps.build-tauri.outcome == 'failure'
        id: failed-step
        shell: pwsh
        run: |
          if ('${{ steps.build-frontend.outcome }}' -eq 'failure') {
            echo "step=build-frontend" >> $env:GITHUB_OUTPUT
            echo "log_file=build-frontend.log" >> $env:GITHUB_OUTPUT
          } else {
            echo "step=build-tauri" >> $env:GITHUB_OUTPUT
            echo "log_file=build-tauri.log" >> $env:GITHUB_OUTPUT
          }

      - name: Upload build log as artifact
        if: failure() || steps.build-frontend.outcome == 'failure' || steps.build-tauri.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build-frontend.log
            build-tauri.log
          retention-days: 14

      - name: Create GitHub Issue with build log
        if: failure() || steps.build-frontend.outcome == 'failure' || steps.build-tauri.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          FAILED_STEP: ${{ steps.failed-step.outputs.step }}
          LOG_FILE: ${{ steps.failed-step.outputs.log_file }}
        with:
          script: |
            const fs = require('fs');
            const failedStep = process.env.FAILED_STEP || 'unknown';
            const logFile = process.env.LOG_FILE || 'build.log';

            let logContent = '';
            try {
              logContent = fs.readFileSync(logFile, 'utf-8');
            } catch { logContent = '(fichier de log introuvable)'; }

            // Truncate to 50KB max for issue body
            const MAX_LEN = 50000;
            const truncated = logContent.length > MAX_LEN;
            const logSnippet = truncated
              ? logContent.slice(0, MAX_LEN) + '\n\n... (tronque, voir l\'artifact build-failure-log pour le log complet)'
              : logContent;

            // Extract error lines for a quick summary
            const errorLines = logContent
              .split('\n')
              .filter(l => /error|Error|ERROR|failed|FAILED|panic/i.test(l))
              .slice(0, 30)
              .join('\n');

            const title = `CI: Build Tauri Windows echoue - ${failedStep} (${new Date().toISOString().slice(0,10)})`;

            const body = `
            ## CI Build Failure - ThesisFrame Desktop

            | | |
            |---|---|
            | **Run** | [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |
            | **Step** | \`${failedStep}\` |
            | **Branch** | \`${context.ref}\` |
            | **Commit** | \`${context.sha.slice(0,7)}\` |
            | **Runner** | \`windows-latest\` |
            | **Date** | ${new Date().toISOString()} |

            ---

            ### Erreurs detectees

            \`\`\`
            ${errorLines || '(aucune erreur textuelle detectee - voir le log complet)'}
            \`\`\`

            ---

            <details>
            <summary>📄 Log complet du build ${truncated ? '(tronque)' : ''}</summary>

            \`\`\`
            ${logSnippet}
            \`\`\`

            </details>

            ---

            *Log complet disponible dans l'artifact \`build-failure-log\` de cette run.*
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure', 'tauri-build', 'windows']
            });

            console.log('Issue creee avec le log du build echoue.');

      - name: Job summary
        if: always()
        run: |
          if ('${{ steps.build-tauri.outcome }}' -eq 'success') {
            echo "## Build reussi :white_check_mark:" >> $env:GITHUB_STEP_SUMMARY
            echo "Téléchargez l'artifact **ThesisFrame-Setup**." >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo "## Build echoue :x:" >> $env:GITHUB_STEP_SUMMARY
            echo "Un issue a été automatiquement créé avec le log d'erreur." >> $env:GITHUB_STEP_SUMMARY
          }
