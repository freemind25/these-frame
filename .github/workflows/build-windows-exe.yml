name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Switch Prisma to SQLite (desktop build)
        shell: pwsh
        run: |
          $schema = Get-Content 'prisma/schema.prisma' -Raw
          $schema = $schema -replace 'provider = "postgresql"', 'provider = "sqlite"'
          Set-Content 'prisma/schema.prisma' $schema
          Write-Host 'Prisma provider switched to sqlite for desktop build'

      - name: Create SQLite DB directory
        run: New-Item -ItemType Directory -Force -Path 'db'

      - name: Build Tauri app
        run: bun run tauri build
        env:
          DATABASE_URL: 'file:./db/custom.db'
          NODE_ENV: production

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.msi
          if-no-files-found: error

      - name: Upload build logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src-tauri/target/release/build.log
          if-no-files-found: ignore
