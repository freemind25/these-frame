name: Build Windows Desktop App

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'download/*'
      - 'worklog.md'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Switch to SQLite + standalone mode
        shell: pwsh
        run: |
          $schema = Get-Content 'prisma/schema.prisma' -Raw
          $schema = $schema -replace 'provider = "postgresql"', 'provider = "sqlite"'
          if ($schema -notmatch 'binaryTargets') {
            $schema = $schema -replace '(generator client \{)', '`$1`n  binaryTargets = ["windows"]'
          }
          Set-Content 'prisma/schema.prisma' $schema

          $config = Get-Content 'next.config.ts' -Raw
          if ($config -notmatch 'output:\s*"standalone"') {
            $config = $config -replace 'const nextConfig: NextConfig = \{', 'const nextConfig: NextConfig = {`n  output: "standalone",'
          }
          Set-Content 'next.config.ts' $config

          Set-Content -Path '.env' -Value 'DATABASE_URL=file:./db/custom.db'
          New-Item -ItemType Directory -Force -Path 'db' | Out-Null

      - name: Generate Prisma + Build Next.js
        run: |
          bunx prisma generate
          bun run build
        env:
          DATABASE_URL: 'file:./db/custom.db'
          NODE_ENV: production

      - name: Download portable Node.js
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v22.16.0/node-v22.16.0-win-x64.zip' -OutFile 'node.zip'
          Expand-Archive -Path 'node.zip' -DestinationPath 'node-tmp'
          Move-Item 'node-tmp/node-v22.16.0-win-x64' 'node-portable'
          Remove-Item 'node.zip', 'node-tmp' -Recurse -Force

      - name: Assemble desktop package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'pkg/app', 'pkg/node' | Out-Null

          # Copy standalone build
          Copy-Item '.next/standalone/*' 'pkg/app/' -Recurse -Force

          # Copy static files
          if (Test-Path '.next/static') {
            Copy-Item '.next/static' 'pkg/app/.next/static' -Recurse -Force
          }
          Copy-Item 'public' 'pkg/app/public' -Recurse -Force

          # Copy portable Node.js (exe only)
          Copy-Item 'node-portable/node.exe' 'pkg/node/node.exe'

          # Remove wrong .env
          Remove-Item 'pkg/app/.env' -Force -ErrorAction SilentlyContinue

          Write-Host 'Package assembled'

      - name: Create start.js
        shell: pwsh
        run: |
          $startJs = @'
          const path = require('path');
          const fs = require('fs');
          const dbDir = path.join(__dirname, 'db');
          if (!fs.existsSync(dbDir)) fs.mkdirSync(dbDir, { recursive: true });
          const dbPath = path.join(dbDir, 'custom.db');
          process.env.DATABASE_URL = 'file:' + dbPath;
          process.env.NODE_ENV = 'production';
          process.env.PORT = '3100';
          process.env.HOSTNAME = '127.0.0.1';
          console.log('ThesisFrame v0.2.0 - Port 3100...');
          console.log('Database: ' + process.env.DATABASE_URL);
          require(path.join(__dirname, 'server.js'));
          '@
          Set-Content 'pkg/app/start.js' -Value $startJs.Trim()

      - name: Create launcher scripts
        shell: pwsh
        run: |
          $bat = @'
          @echo off
          chcp 65001 >nul 2>&1
          title ThesisFrame
          echo.
          echo  ============================================
          echo     ThesisFrame v0.2.0
          echo  ============================================
          echo.
          for /f "tokens=5" %%a in ('netstat -ano ^| findstr :3100 ^| findstr LISTENING 2^>nul') do (
              taskkill /F /PID %%a >nul 2>&1
          )
          timeout /t 2 /nobreak >nul
          echo  Demarrage du serveur...
          start "ThesisFrame Server" /MIN "%~dp0node\node.exe" "%~dp0app\start.js"
          echo  Patientez 15 secondes...
          for /L %%i in (1,1,15) do (
              <nul set /p=.
              timeout /t 1 /nobreak >nul
          )
          echo.
          start http://127.0.0.1:3100
          echo.
          echo  ThesisFrame est en cours d'execution.
          echo  Pour arreter: fermez cette fenetre.
          echo.
          pause >nul
          for /f "tokens=5" %%a in ('netstat -ano ^| findstr :3100 ^| findstr LISTENING 2^>nul') do (
              taskkill /F /PID %%a >nul 2>&1
          )
          '@
          Set-Content 'pkg/DEMARRER.bat' -Value $bat.Trim()

          $stopBat = @'
          @echo off
          echo Arret de ThesisFrame...
          for /f "tokens=5" %%a in ('netstat -ano ^| findstr :3100 ^| findstr LISTENING 2^>nul') do (
              taskkill /F /PID %%a >nul 2>&1
          )
          echo ThesisFrame est arrete.
          pause
          '@
          Set-Content 'pkg/ARRETER.bat' -Value $stopBat.Trim()

          Set-Content 'pkg/README.txt' -Value 'THESISFRAME v0.2.0 - Double-cliquer sur DEMARRER.bat'

      - name: Test server on Windows
        shell: pwsh
        run: |
          $env:DATABASE_URL = 'file:./pkg/app/db/custom.db'
          $env:NODE_ENV = 'production'
          $env:PORT = '9999'
          $env:HOSTNAME = '127.0.0.1'
          $proc = Start-Process -FilePath 'pkg/node/node.exe' -ArgumentList 'pkg/app/start.js' -PassThru -NoNewWindow
          Start-Sleep -Seconds 25
          try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:9999/' -TimeoutSec 10 -UseBasicParsing
              Write-Host "TEST PASSED: status=$($r.StatusCode) size=$($r.Content.Length)"
          } catch {
              Write-Host "TEST FAILED: $($_.Exception.Message)"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'pkg/*' -DestinationPath 'ThesisFrame-Desktop.zip'
          $size = [math]::Round((Get-Item 'ThesisFrame-Desktop.zip').Length / 1MB, 1)
          Write-Host "ZIP: ${size}MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesisframe-desktop
          path: ThesisFrame-Desktop.zip
          retention-days: 7

      - name: Summary
        if: always()
        run: echo "Build complete. Download the thesisframe-desktop artifact."
